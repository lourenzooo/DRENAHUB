
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # API real da DrenaHub
  - job_name: "drenahub-api"
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - "drenahub-api.onrender.com"

  # Simulacao controlada de falha
  - job_name: "drenahub-alert-test"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:65534"
