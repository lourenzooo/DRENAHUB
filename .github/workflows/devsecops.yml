
name: DrenaHub - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Testes e Seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testes automatizados
        run: python -m pytest tests/ -q

      - name: Gitleaks - verificar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep - analisar codigo
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error src/

      - name: Construir imagem Docker
        run: docker build -t drenahub:ci .

      - name: Trivy - analisar imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: drenahub:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy automatico no Render
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Publicar DrenaHub no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Erro: secret do Render nao configurado"
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Solicitacao de deploy enviada ao Render"
