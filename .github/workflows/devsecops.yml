
name: DrenaHub - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Testes e Seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testes automatizados
        run: python -m pytest tests/ -q

      - name: Gitleaks - verificar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep - analisar codigo
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error src/

      - name: Construir imagem Docker
        run: docker build -t drenahub:ci .

      - name: Trivy - analisar imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: drenahub:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
